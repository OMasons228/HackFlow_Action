<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HackFlow — отбор участников хакатона</title>
<style>
:root{--bg:#f1f2f4;--cd:#fff;--tx:#1f2328;--mu:#636b76;--bd:#d3d7dd;--ac:#0b6b4f;--ab:#e6f2ee;--ok:#0b7a4b;--er:#c0392b;--wa:#b25e00;--bl:#1f5fbf;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif}
#sh{display:flex;min-height:100vh}#sd{width:230px;flex:none;background:#fff;border-right:1px solid var(--bd);padding:20px 0;position:sticky;top:0;height:100vh}#sh.g #sd{display:none}#ct{flex:1;min-width:0}
.tb{display:flex;align-items:center;gap:12px;padding:10px 28px;background:#fff;border-bottom:1px solid var(--bd);min-height:52px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;cursor:pointer;padding:0 20px 14px}.tb .logo{padding:0}.logo i{width:16px;height:16px;background:var(--ac);display:inline-block;clip-path:polygon(0 0,100% 0,100% 55%,55% 55%,55% 100%,0 100%)}
.role{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);padding:0 20px 8px}
#sd a{display:block;padding:9px 20px;cursor:pointer;border-left:3px solid transparent}#sd a:hover{background:var(--bg)}#sd a.on{border-left-color:var(--ac);background:var(--ab);font-weight:600;color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:28px}#sh.g main{max-width:1040px;padding:44px 28px}
@media(max-width:760px){#sh{display:block}#sd{width:auto;height:auto;position:static;display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--bd)}#sd .logo,#sd .role{display:none}#sd a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}#sd a.on{border-bottom-color:var(--ac)}main{padding:18px}.tb{padding:10px 16px}}
h1,h2,h3{margin:0 0 10px;line-height:1.2;font-weight:600}h1{font-size:40px;letter-spacing:-.02em}h2{font-size:22px}h3{font-size:16px}p{margin:0 0 10px}a{color:var(--ac);cursor:pointer}
.mu{color:var(--mu)}.sm{font-size:13px}.sp{flex:1}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:3px;padding:18px 20px;margin-bottom:14px}
.btn{border:1px solid #9aa1ab;background:#fff;color:var(--tx);padding:8px 16px;border-radius:3px;font:inherit;font-weight:500;cursor:pointer}.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{background:#085540;color:#fff}.btn.d{color:var(--er);border-color:#e0a8a1}.btn.s{padding:4px 11px;font-size:13px}.btn.l{padding:11px 24px;font-size:16px}
label{display:block;font-weight:500;font-size:13px;margin:12px 0 4px}input,select,textarea{width:100%;padding:9px 11px;border:1px solid #9aa1ab;border-radius:3px;background:#fff;color:var(--tx);font:inherit}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}input[type=radio],input[type=checkbox]{width:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}@media(max-width:640px){.g2{grid-template-columns:1fr}}
.b{font-weight:600;font-size:13px;white-space:nowrap}.b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px}.b-gr{color:var(--mu)}.b-bl{color:var(--bl)}.b-wa{color:var(--wa)}.b-ok{color:var(--ok)}.b-er{color:var(--er)}
.land{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:start}@media(max-width:860px){.land{grid-template-columns:1fr;gap:30px}h1{font-size:32px}}
.eyebrow{font-size:13px;color:var(--ac);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}.lead{font-size:18px;color:#3b424c;max-width:560px;margin-bottom:22px}
dl{display:grid;grid-template-columns:100px 1fr;gap:8px 16px;margin:0 0 26px;padding:16px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}dt{color:var(--mu)}dd{margin:0}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--tx);counter-reset:s}.tl li{position:relative;padding:0 0 26px 18px;counter-increment:s}.tl li::before{content:counter(s);position:absolute;left:-36px;top:-2px;width:26px;height:26px;background:var(--tx);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center}.tl b{display:block}.tl span{color:var(--mu);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.j{justify-content:space-between}
.bar{height:8px;background:#e3e6ea;border-radius:2px;overflow:hidden}.bar>div{height:100%;background:var(--ac)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}th{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}.tw{overflow-x:auto}
.chip{padding:5px 12px;border-radius:3px;border:1px solid #9aa1ab;background:#fff;cursor:pointer;font-size:13px}.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.num{font-size:34px;font-weight:600;line-height:1.2}.ov{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:start center;overflow:auto;padding:30px 12px}.md{background:#fff;border-radius:3px;padding:24px;width:100%;max-width:640px}
.pn{position:fixed;right:20px;top:56px;width:min(380px,92vw);max-height:70vh;overflow:auto;background:#fff;border:1px solid #9aa1ab;border-radius:3px;padding:14px;box-shadow:0 6px 24px #0003;z-index:10}
.nt{padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.nt.u{font-weight:600;border-left:3px solid var(--ac);padding-left:9px}
.tk{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.lk{opacity:.55}
.q{border:1px solid var(--bd);border-radius:3px;padding:14px;margin-bottom:12px}.op{display:flex;gap:10px;align-items:center;padding:6px 0}.op label{margin:0;font-weight:400;font-size:15px}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:3px;z-index:30}.er{color:var(--er);font-size:13px;margin-top:6px}
</style></head><body><div id="sh"><aside id="sd"></aside><div id="ct"><div class="tb" id="hd"></div><main id="app"></main></div></div><div id="pn"></div><div id="mo"></div><div id="tt"></div>
<script>
const K='hackflow_v3',D=864e5,N=()=>Date.now();let S,V={p:'home'},M=null;
const ST={registered:['Зарегистрирован','b-gr'],progress:['Проходит отбор','b-bl'],pending:['Ожидает проверки','b-wa'],admitted:['Допущен к основному этапу','b-ok'],rejected:['Не прошёл отбор','b-er']};
const HINT={registered:'Вы зарегистрированы. Пройдите испытания ниже — так вы попадёте на хакатон.',progress:'Отбор идёт. Выполните оставшиеся испытания до их дедлайнов.',pending:'Все материалы получены. Организаторы проверяют работы — мы сообщим о результате.',admitted:'Поздравляем! Вы допущены к основному этапу.',rejected:'К сожалению, вы не прошли отбор. Спасибо за участие!'};
const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bd=s=>`<span class="b ${ST[s][1]}">${ST[s][0]}</span>`;
const fd=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const li=t=>new Date(t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const $=i=>document.getElementById(i),val=i=>($(i)?.value||'').trim();
function seed(){const n=N(),P=(id,name,st,c)=>({id,role:'p',name,email:id+'@demo.ru',pass:'demo123',phone:'+7 900 123-45-67',tg:'@'+id,uni:'НИУ ВШЭ',dir:'Прикладная информатика',course:c||'2',status:st,at:n-4*D});
const qs=[['Что означает HTML?',['Язык гипертекстовой разметки','Язык программирования баз данных','Протокол передачи файлов'],0],['Какой протокол защищает передачу данных в вебе?',['HTTP','HTTPS','FTP'],1],['Что делает команда git commit?',['Загружает код на сервер','Удаляет ветку','Фиксирует изменения в локальном репозитории'],2],['Какая структура данных работает по принципу LIFO?',['Очередь','Стек','Хеш-таблица'],1],['Что такое API?',['Интерфейс взаимодействия программ','Язык стилей','Тип базы данных'],0]].map(([q,o,c])=>({type:'choice',q,o:[...o,''],c}));qs.push({type:'open',q:'Расскажите, почему вы хотите участвовать в хакатоне (2–3 предложения).',o:[],c:0});
const sb=(uid,tid,o)=>({id:uid+tid,uid,tid,at:n-D,...o});
return{ev:{title:'Актион HackFlow Hack 2026',desc:'Студенческий хакатон: 48 часов, реальные кейсы от компании «Актион», наставники и призовой фонд. Пройдите отбор онлайн — и получите место в основной команде мероприятия.',dates:'12–14 декабря 2026',place:'Москва, офис «Актион» + онлайн',next:'Сбор участников 12 декабря в 10:00. Закрытый чат основного этапа: t.me/hackflow_main. Командные кейсы будут опубликованы за сутки до старта.',seq:true},
users:[{id:'o1',role:'o',name:'Анна Организатор',email:'org@hackflow.ru',pass:'org123'},{...P('student','Иван Студентов','registered','3'),email:'student@hackflow.ru',pass:'student123'},P('d1','Мария Орлова','admitted'),P('d2','Павел Жуков','rejected'),P('d3','Елена Ким','pending','3'),P('d4','Дмитрий Фомин','progress','1'),P('d5','Софья Лебедева','registered')],
tasks:[{id:'t1',type:'test',title:'Тест по основам IT',desc:'6 вопросов: 5 с выбором ответа (проверяются автоматически) и 1 открытый — его оценит организатор. Попытка одна.',pass:60,dl:n+5*D,qs},{id:'t2',type:'upload',title:'Видеовизитка',desc:'Расскажите о себе и о том, почему хотите участвовать.',instr:'Видео до 2 минут. Загрузите файл или вставьте ссылку (YouTube, Google Drive, Яндекс.Диск). Расскажите: кто вы, чем занимаетесь, какой опыт у вас есть.',dl:n+7*D}],
subs:[sb('d1','t1',{ans:[0,1,2,1,0,'Хочу решать реальные задачи'],gr:{5:1},pct:100,res:'pass'}),sb('d1','t2',{link:'https://youtu.be/demo1',note:'',res:'pass',rv:{score:9,c:'Отличная подача!',at:n}}),sb('d2','t1',{ans:[1,0,0,0,1,'Не знаю'],gr:{5:0},pct:0,res:'fail'}),sb('d3','t1',{ans:[0,1,2,1,1,'Хочу попробовать силы'],gr:{5:1},pct:83,res:'pass'}),sb('d3','t2',{link:'https://youtu.be/demo3',note:'Видео на 1:40',res:null}),sb('d4','t1',{ans:[0,1,2,0,0,'Опыт и контакты'],gr:{5:1},pct:83,res:'pass'})],n:[{id:'x1',uid:'student',text:'Добро пожаловать в HackFlow! Регистрация подтверждена.',at:n,r:0}],dl:[],me:null}}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const U=id=>S.users.find(u=>u.id===id),me=()=>U(S.me),T=id=>S.tasks.find(t=>t.id===id),sub=(u,t)=>S.subs.find(s=>s.uid===u&&s.tid===t);
const parts=()=>S.users.filter(u=>u.role==='p');
function notify(uid,text){S.n.unshift({id:'n'+N()+Math.random(),uid,text,at:N(),r:0})}
function compute(uid){const ss=S.subs.filter(s=>s.uid===uid);if(ss.some(s=>s.res==='fail'))return'rejected';
if(S.tasks.some(t=>!sub(uid,t.id)&&t.dl<N()))return'rejected';if(!ss.length)return'registered';
if(S.tasks.every(t=>sub(uid,t.id)))return ss.some(s=>s.res===null)?'pending':'admitted';return'progress'}
function sync(uid){const u=U(uid);if(!u||u.manual)return;const s=compute(uid);if(s===u.status)return;u.status=s;
if(s==='admitted')notify(uid,'Вы допущены к основному этапу! Подробности — в личном кабинете.');
if(s==='rejected')notify(uid,'Отбор завершён: вы не прошли. Спасибо за участие!');
if(s==='pending')notify(uid,'Все материалы получены и переданы на проверку.')}
const syncAll=()=>{parts().forEach(u=>sync(u.id));save()};
function deadlines(uid){S.tasks.forEach(t=>{const k=uid+t.id;if(!sub(uid,t.id)&&t.dl>N()&&t.dl-N()<2*D&&!S.dl.includes(k)){S.dl.push(k);notify(uid,`Скоро дедлайн: «${t.title}» — до ${fd(t.dl)}.`)}})}
function toast(m){$('tt').innerHTML=`<div class="tt">${h(m)}</div>`;setTimeout(()=>$('tt').innerHTML='',2600)}
function go(p,a){V={p,a};V.bell=0;modal(null);render();scrollTo(0,0)}
function modal(x){M=x;$('mo').innerHTML=x?`<div class="ov" onmousedown="if(event.target===this)modal(null)"><div class="md">${x}</div></div>`:''}
function login(e,pw){const u=S.users.find(u=>u.email.toLowerCase()===e.toLowerCase()&&u.pass===pw);if(!u)return false;S.me=u.id;if(u.role==='p'){syncAll();deadlines(u.id)}save();go(u.role==='o'?'odash':'pcab');return true}
function logout(){S.me=null;save();go('home')}
function doLogin(){if(!login(val('le'),$('lp').value))$('lerr').textContent='Неверная почта или пароль'}
function demo(r){r==='o'?login('org@hackflow.ru','org123'):login('student@hackflow.ru','student123')}
function reset(){ask('Сбросить все данные до демо-состояния?',()=>{try{localStorage.removeItem(K)}catch(e){}S=seed();save();modal(null);go('home')})}
function register(){const f={name:val('rn'),email:val('re').toLowerCase(),phone:val('rp'),tg:val('rt'),uni:val('ru'),dir:val('rd'),course:val('rc')},pw=$('rw').value,er=$('rerr');
for(const k in f)if(!f[k])return er.textContent='Заполните все поля формы';
if(!/^\S+@\S+\.\S+$/.test(f.email))return er.textContent='Укажите корректную почту';if(pw.length<6)return er.textContent='Пароль — минимум 6 символов';
if(S.users.some(u=>u.email===f.email))return er.textContent='Эта почта уже зарегистрирована — войдите';
const u={id:'u'+N(),role:'p',...f,pass:pw,status:'registered',at:N()};S.users.push(u);S.me=u.id;
notify(u.id,'Регистрация подтверждена. Добро пожаловать на «'+S.ev.title+'»!');S.tasks.forEach(t=>notify(u.id,`Новое испытание: «${t.title}» — до ${fd(t.dl)}.`));save();toast('Вы зарегистрированы!');go('pcab')}
function saveProfile(){const u=me();for(const [k,i] of [['name','pn1'],['phone','pp'],['tg','pt'],['uni','pu'],['dir','pd'],['course','pc']]){if(!val(i))return toast('Заполните все поля');u[k]=val(i)}save();toast('Профиль сохранён')}
/* ---- views ---- */
function head(){const u=me(),o=u?.role==='o',on=p=>V.p===p?'on':'',nn=u?S.n.filter(n=>n.uid===u.id&&!n.r).length:0,rq=S.subs.filter(s=>s.res===null).length;
$('sh').className=u?'':'g';const L=[['odash','Обзор'],['oppl','Участники'],['orev','Проверка'+(rq?' ('+rq+')':'')],['otsk','Испытания'],['oev','Мероприятие']],Pl=[['pcab','Мой отбор'],['pprof','Профиль']];
$('sd').innerHTML=u?`<div class="logo" onclick="go('${o?'odash':'pcab'}')"><i></i>HackFlow</div><div class="role">${o?'Организатор':'Участник'}</div>${(o?L:Pl).map(x=>`<a class="${on(x[0])}" onclick="go('${x[0]}')">${x[1]}</a>`).join('')}`:'';
$('hd').innerHTML=u?`<span class="mu sm">${h(S.ev.title)}</span><span class="sp"></span>${o?'':`<button class="btn s" onclick="V.bell=!V.bell;notes()">Уведомления${nn?` (${nn})`:''}</button>`}<span class="sm">${h(u.name)}</span><button class="btn s" onclick="logout()">Выйти</button>`:`<span class="logo" onclick="go('home')"><i></i>HackFlow</span><span class="sp"></span><button class="btn s" onclick="go('login')">Войти</button>`;notes()}
function notes(){const u=me();if(!u||!V.bell||u.role==='o'){$('pn').innerHTML='';return}const l=S.n.filter(n=>n.uid===u.id);
$('pn').innerHTML=`<div class="pn"><div class="row j"><h3>Уведомления</h3><button class="btn s" onclick="S.n.forEach(n=>n.uid==='${u.id}'&&(n.r=1));save();head()">Прочитать все</button></div>${l.map(n=>`<div class="nt ${n.r?'':'u'}">${h(n.text)}<div class="mu sm">${fd(n.at)}</div></div>`).join('')||'<p class="mu">Пока нет уведомлений</p>'}</div>`}
function render(){const u=me(),o=u?.role==='o',P=V.p;if(u&&!U(u.id)){S.me=null;return go('home')}
if(['pcab','ptask','pprof'].includes(P)&&u?.role!=='p')return go(u?'odash':'login');if(P[0]==='o'&&!o)return go(u?'pcab':'login');
const x=VIEWS[P]();head();$('app').innerHTML=x}
const how=()=>`<div class="g3">${[['Регистрация','Заполните короткую анкету и получите личный кабинет.'],['Испытания','Тест с автопроверкой и видеовизитка — в удобное время до дедлайна.'],['Решение','Следите за статусом. Допуск приходит уведомлением в кабинет.']].map((x,i)=>`<div class="cd st"><i>${i+1}</i><div><h3>${x[0]}</h3><p class="mu sm">${x[1]}</p></div></div>`).join('')}</div>`;
function guide(){modal(`<h2>Как проверить сценарии</h2><p class="mu">Данные хранятся в браузере. Выходите из аккаунта и входите под другой ролью.</p><ol><li><b>Участник</b> (student@hackflow.ru / student123): «Мой отбор» → пройдите тест → отправьте видеовизитку → статус станет «Ожидает проверки».</li><li><b>Организатор</b> (org@hackflow.ru / org123): «Проверка» → оцените видеовизитку → «Участники» → откройте карточку, измените статус вручную → «Выгрузить CSV».</li><li>Снова войдите участником: уведомление (кнопка «Уведомления» вверху) и обновлённый статус; при допуске открыта информация об основном этапе.</li><li>Организатор также создаёт тесты и задания во вкладке «Испытания» и видит аналитику воронки в «Обзоре».</li></ol><div class="row"><button class="btn p" onclick="modal(null)">Понятно</button><button class="btn d" onclick="modal(null);reset()">Сбросить демо-данные</button></div>`)}
const VIEWS={
home(){const e=S.ev;return`<div class="land"><div><div class="eyebrow">Студенческий хакатон · ${h(e.dates)}</div><h1>${h(e.title)}</h1><p class="lead">${h(e.desc)}</p><dl><dt>Место</dt><dd>${h(e.place)}</dd><dt>Формат</dt><dd>Заявка и отбор проходят онлайн</dd><dt>Результат</dt><dd>Решение о допуске — в личном кабинете</dd></dl><div class="row"><button class="btn p l" onclick="go('reg')">Зарегистрироваться</button><button class="btn l" onclick="go('login')">Войти</button></div><p class="sm mu" style="margin-top:18px"><a onclick="guide()">Тестовые аккаунты и инструкция для проверки</a></p></div><ol class="tl"><li><b>Регистрация</b><span>Анкета и доступ в личный кабинет</span></li>${S.tasks.map(t=>`<li><b>${h(t.title)}</b><span>${t.type==='test'?'Тестирование':'Отправка материала'} · до ${fd(t.dl)}</span></li>`).join('')}<li><b>Решение</b><span>Допуск к основному этапу или отказ</span></li></ol></div>`},

const card=(t,i)=>{const b=sub(u.id,t.id),pv=i>0&&S.ev.seq&&!sub(u.id,ts[i-1].id),late=!b&&t.dl<N(),lock=pv||(late&&0);

ptask(){const u=me(),t=T(V.a);if(!t)return go('pcab');const b=sub(u.id,t.id),late=t.dl<N();

return`<button class="btn s" onclick="go('pcab')">← Назад к испытаниям</button><h2 style="margin-top:14px">${h(t.title)}</h2><p class="mu">${h(t.desc)}</p>${t.instr?`<div class="cd"><h3>Инструкция</h3><p>${h(t.instr)}</p></div>`:''}<p class="sm mu">Срок выполнения: до ${fd(t.dl)}${late&&!b?' — <b style="color:var(--er)">срок истёк</b>':''}</p>${late&&!b?'<div class="cd mu">Приём работ закрыт.</div>':body}`},
pprof(){const u=me(),f=(l,i,k)=>`<div><label>${l}</label><input id="${i}" value="${h(u[k])}"></div>`;return`<h2>Профиль</h2><div class="cd"><div class="g2">${f('ФИО','pn1','name')}<div><label>Почта (логин)</label><input value="${h(u.email)}" disabled></div>${f('Телефон','pp','phone')}${f('Telegram','pt','tg')}${f('Учебное заведение','pu','uni')}${f('Направление','pd','dir')}${f('Курс','pc','course')}</div><button class="btn p" style="margin-top:14px" onclick="saveProfile()">Сохранить</button></div>`},
odash(){const p=parts(),c=s=>p.filter(u=>u.status===s).length,st=p.filter(u=>S.subs.some(s=>s.uid===u.id)).length,fin=p.filter(u=>S.tasks.length&&S.tasks.every(t=>sub(u.id,t.id))).length,ad=c('admitted'),pc=(a,b)=>b?Math.round(a/b*100):0;
const fn=[['Зарегистрировались',p.length],['Начали испытания',st],['Завершили все испытания',fin],['Допущены',ad]];
return`<h2>Обзор отбора</h2><div class="g3">${[['Зарегистрировано',p.length],['Завершили испытания',fin],['Допущено',ad],['Не прошли',c('rejected')],['Ждут проверки',c('pending')]].map(x=>`<div class="cd"><div class="mu sm">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')}</div><div class="cd"><h3>Воронка и конверсия</h3>${fn.map((x,i)=>`<div style="margin:12px 0"><div class="row j sm"><span>${x[0]}: <b>${x[1]}</b></span><span class="mu">${i?pc(x[1],fn[i-1][1])+'% от предыдущего этапа':'100%'}</span></div><div class="bar"><div style="width:${pc(x[1],p.length)}%"></div></div></div>`).join('')}</div>`},
oppl(){V.f=V.f||'all';return`<div class="row j"><h2>Участники</h2><button class="btn" onclick="exportCsv()">Выгрузить результаты (CSV)</button></div><div class="row" style="margin-bottom:12px">${['all',...Object.keys(ST)].map(k=>`<span class="chip ${V.f===k?'on':''}" onclick="V.f='${k}';render()">${k==='all'?'Все':ST[k][0]} (${k==='all'?parts().length:parts().filter(u=>u.status===k).length})</span>`).join('')}</div><p class="sm mu">Список отсортирован по рейтингу — среднему результату испытаний (тест — в %, материал — оценка × 10).</p><input placeholder="Поиск по ФИО, вузу, почте" value="${h(V.q||'')}" oninput="V.q=this.value;draw()" style="margin-bottom:12px"><div class="cd tw" id="pl"></div>${setTimeout(draw)&&''}`},
orev(){const l=S.subs.filter(s=>s.res===null);return`<h2>Проверка материалов</h2>${l.map(s=>{const u=U(s.uid),t=T(s.tid);if(t.type==='test')return revT(s,u,t);return`<div class="cd"><div class="row j"><div><b>${h(u.name)}</b> · ${h(t.title)}<div class="sm mu">Отправлено ${fd(s.at)}</div></div></div>${s.link?`<p><a href="${h(s.link)}" target="_blank" rel="noopener" style="color:var(--ac)">${h(s.link)}</a></p>`:''}${s.file?`<p>${h(s.file.name)} ${s.file.data?`<a href="${s.file.data}" download="${h(s.file.name)}" style="color:var(--ac)">скачать</a>`:'(файл больше 1 МБ — только название)'}</p>`:''}${s.note?`<p class="mu">${h(s.note)}</p>`:''}<div class="g2"><div><label>Оценка (0–10)</label><input id="sc${s.id}" type="number" min="0" max="10" value="7"></div><div><label>Комментарий участнику</label><input id="cm${s.id}"></div></div><div class="row" style="margin-top:12px"><button class="btn p" onclick="review('${s.id}',1)">Принять</button><button class="btn d" onclick="review('${s.id}',0)">Отклонить</button></div></div>`}).join('')||'<div class="cd mu">Все материалы проверены — очередь пуста.</div>'}`},
otsk(){return`<div class="row j"><h2>Испытания (воронка)</h2><div class="row"><button class="btn p" onclick="editT('test')">+ Тест</button><button class="btn p" onclick="editT('upload')">+ Задание с материалом</button></div></div><p class="mu sm">Участники проходят испытания сверху вниз${S.ev.seq?'':' (последовательность не обязательна)'}. Порядок меняйте стрелками.</p>${S.tasks.map((t,i)=>`<div class="cd tk"><div><div class="mu sm">${t.type==='test'?'Тест · '+t.qs.length+' вопр. · проходной '+t.pass+'%':'Отправка материала'}</div><h3>${i+1}. ${h(t.title)}</h3><div class="sm mu">Дедлайн: ${fd(t.dl)} · Выполнили: ${S.subs.filter(s=>s.tid===t.id).length}</div></div><div class="row"><button class="btn s" onclick="mv(${i},-1)">↑</button><button class="btn s" onclick="mv(${i},1)">↓</button><button class="btn s" onclick="editT('${t.id}')">Изменить</button><button class="btn s d" onclick="delT('${t.id}')">Удалить</button></div></div>`).join('')||'<div class="cd mu">Испытаний нет. Добавьте первое кнопкой выше.</div>'}`},
oev(){const e=S.ev,f=(l,i,k)=>`<label>${l}</label><input id="${i}" value="${h(e[k])}">`;return`<h2>Мероприятие</h2><div class="cd">${f('Название','en','title')}<div class="g2"><div>${f('Даты','ed','dates')}</div><div>${f('Место','ep','place')}</div></div><label>Описание (лендинг)</label><textarea id="ec" rows="3">${h(e.desc)}</textarea><label>Информация об основном этапе (видят только допущенные)</label><textarea id="ex" rows="3">${h(e.next)}</textarea><label class="row" style="font-weight:400"><input type="checkbox" id="es" style="width:auto" ${e.seq?'checked':''}> Проходить испытания строго по порядку</label><button class="btn p" style="margin-top:12px" onclick="saveEv()">Сохранить</button></div>`}};
/* ---- actions ---- */
let AF;function ask(t,f){AF=f;modal(`<h3>${h(t)}</h3><div class="row" style="margin-top:14px"><button class="btn p" onclick="AF()">Да</button><button class="btn" onclick="modal(null)">Отмена</button></div>`)}
function submitTest(id){const t=T(id),ans=t.qs.map((q,i)=>{if(q.type==='open')return val('qa'+i);const r=document.querySelector(`input[name=q${i}]:checked`);return r?+r.value:-1});
if(ans.some((a,i)=>t.qs[i].type==='open'?!a:a===-1))return $('terr').textContent='Ответьте на все вопросы';
ask('Завершить тест? Изменить ответы будет нельзя.',()=>finishTest(id,ans))}
function calc(t,b){return Math.round(t.qs.filter((q,i)=>q.type==='open'?b.gr?.[i]==1:b.ans[i]===q.c).length/t.qs.length*100)}
function finishTest(id,ans){const t=T(id),u=me(),b={id:u.id+id,uid:u.id,tid:id,at:N(),ans,gr:{}};
if(t.qs.some(q=>q.type==='open')){b.pct=null;b.res=null;notify(u.id,`Тест «${t.title}» отправлен: открытые ответы ждут проверки организатора.`)}
else{b.pct=calc(t,b);b.res=b.pct>=t.pass?'pass':'fail';notify(u.id,`Тест «${t.title}» завершён: ${b.pct}% — ${b.res==='pass'?'пройден':'не пройден'}.`)}
S.subs.push(b);modal(null);sync(u.id);save();render()}
function revT(s,u,t){return`<div class="cd"><div class="row j"><div><b>${h(u.name)}</b> · ${h(t.title)}<div class="sm mu">Отправлено ${fd(s.at)}</div></div><div>Верно в тестовой части: <b>${okN(t,s)} из ${cl(t).length}</b><div class="sm mu">проходной балл ${t.pass}%</div></div></div><h3 style="margin-top:14px">Ответы участника</h3>${det(t,s,s.id)}<label>Комментарий участнику</label><input id="cm${s.id}"><button class="btn p" style="margin-top:12px" onclick="reviewT('${s.id}')">Сохранить результат теста</button></div>`}
function reviewT(id){const s=S.subs.find(x=>x.id===id),t=T(s.tid);t.qs.forEach((q,i)=>{if(q.type==='open')s.gr[i]=+val(`g${id}_${i}`)});s.pct=calc(t,s);s.res=s.pct>=t.pass?'pass':'fail';s.rv={c:val('cm'+id),at:N()};
notify(s.uid,`Проверка завершена: тест «${t.title}» — ${s.pct}%, ${s.res==='pass'?'пройден':'не пройден'}${s.rv.c?'. Комментарий: '+s.rv.c:''}.`);sync(s.uid);save();toast('Результат сохранён');render()}
const cl=t=>t.qs.filter(q=>q.type!=='open');
const okN=(t,b)=>cl(t).filter(q=>b.ans[t.qs.indexOf(q)]===q.c).length;
function det(t,b,id){return t.qs.map((q,i)=>{const a=b.ans[i];if(q.type==='open')return`<div class="q"><b>${i+1}. ${h(q.q)}</b><div class="sm mu">Открытый ответ${b.res===null?'':' · '+(b.gr?.[i]==1?'оценён: верно':'оценён: неверно')}</div><p style="margin:6px 0">${h(a)}</p>${id?`<label>Ваша оценка ответа</label><select id="g${id}_${i}"><option value="1">Верно</option><option value="0">Неверно</option></select>`:''}</div>`;const g=a===q.c;return`<div class="q"><b>${i+1}. ${h(q.q)}</b><div class="sm" style="margin-top:6px"><span class="b ${g?'b-ok':'b-er'}">${g?'Верно':'Неверно'}</span> · ответ участника: ${h(q.o[a]??'—')}${g?'':' · правильный: '+h(q.o[q.c])}</div></div>`}).join('')}
function rate(u){const v=S.tasks.map(t=>{const b=sub(u.id,t.id);if(!b||b.res===null)return null;if(t.type==='test')return b.pct;const sc=parseFloat(b.rv?.score);return b.res==='fail'?0:isNaN(sc)?100:sc*10}).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b)/v.length):null}
function quick(id,st){$('ns').value=st;setSt(id)}
const tp=b=>b.pct==null?'на проверке':b.pct+'%';
async function submitUp(id){const t=T(id),u=me(),link=val('sl'),fl=$('sf').files[0],er=$('terr');
if(!link&&!fl)return er.textContent='Добавьте ссылку или файл';if(link&&!/^https?:\/\/\S+$/i.test(link))return er.textContent='Ссылка должна начинаться с http:// или https://';
let file=null;if(fl){file={name:fl.name,size:fl.size};if(fl.size<1e6)file.data=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(fl)})}
S.subs.push({id:u.id+id,uid:u.id,tid:id,at:N(),link,file,note:val('sn'),res:null});notify(u.id,`Материал «${t.title}» получен и ожидает проверки.`);sync(u.id);save();toast('Материал отправлен');render()}
function review(id,ok){const s=S.subs.find(x=>x.id===id),t=T(s.tid);s.res=ok?'pass':'fail';s.rv={score:val('sc'+id),c:val('cm'+id),at:N()};
notify(s.uid,`Проверка завершена: «${t.title}» — ${ok?'принято':'не принято'}${s.rv.c?'. Комментарий: '+s.rv.c:''}.`);sync(s.uid);save();toast('Результат сохранён');render()}
function draw(){const q=(V.q||'').toLowerCase(),l=parts().filter(u=>(V.f==='all'||u.status===V.f)&&(u.name+u.uni+u.email).toLowerCase().includes(q)).sort((a,b)=>(rate(b)??-1)-(rate(a)??-1));
$('pl')&&($('pl').innerHTML=l.length?`<table><tr><th>ФИО</th><th>Вуз / курс</th><th>Статус</th><th>Тест</th><th>Рейтинг</th><th></th></tr>${l.map(u=>{const b=sub(u.id,'t1')||S.subs.find(s=>s.uid===u.id&&T(s.tid)?.type==='test');return`<tr><td><b>${h(u.name)}</b><div class="sm mu">${h(u.email)}</div></td><td>${h(u.uni)}, ${h(u.course)}</td><td>${bd(u.status)}${u.manual?' <span class="sm mu">вручную</span>':''}</td><td>${b?tp(b):'—'}</td><td>${rate(u)??'—'}</td><td><button class="btn s" onclick="openP('${u.id}')">Открыть</button></td></tr>`}).join('')}</table>`:'<p class="mu">Никого не найдено</p>')}
function openP(id){const u=U(id);modal(`<div class="row j"><h2>${h(u.name)}</h2><button class="btn s" onclick="modal(null)">Закрыть</button></div><p class="sm mu">${h(u.email)} · ${h(u.phone)} · ${h(u.tg)}<br>${h(u.uni)} · ${h(u.dir)} · курс ${h(u.course)}</p><h3>Результаты испытаний</h3>${S.tasks.map(t=>{const b=sub(id,t.id);return`<div class="row j sm" style="padding:6px 0;border-bottom:1px solid var(--bd)"><span>${h(t.title)}</span><span>${b?(t.type==='test'&&b.pct!=null?b.pct+'% · ':'')+(b.res===null?'ожидает проверки':b.res==='pass'?'пройдено':'не пройдено')+' · '+fd(b.at):'не выполнено'}</span></div>${b&&t.type==='test'?`<details style="padding:6px 0"><summary class="sm" style="cursor:pointer;color:var(--ac)">Ответы участника (верно ${okN(t,b)} из ${cl(t).length} в тестовой части)</summary>${det(t,b)}</details>`:''}${b&&t.type==='upload'?`<div class="sm mu" style="padding:4px 0">${b.link?'Ссылка: '+h(b.link)+' ':''}${b.file?'Файл: '+h(b.file.name)+' ':''}${b.rv?.c?'· Комментарий: '+h(b.rv.c):''}</div>`:''}`}).join('')}<h3 style="margin-top:16px">Решение по участнику</h3><div class="row" style="margin-bottom:10px"><button class="btn p" onclick="quick('${id}','admitted')">Допустить к основному этапу</button><button class="btn d" onclick="quick('${id}','rejected')">Отклонить заявку</button></div><div class="sm mu">Или выберите другой статус:</div><div class="row"><select id="ns" style="width:auto">${Object.keys(ST).map(k=>`<option value="${k}" ${u.status===k?'selected':''}>${ST[k][0]}</option>`).join('')}</select><button class="btn p" onclick="setSt('${id}')">Применить</button>${u.manual?`<button class="btn" onclick="auto('${id}')">Вернуть авторасчёт</button>`:''}</div><p class="sm mu">Ручное изменение отправит участнику уведомление.</p>`)}
function setSt(id){const u=U(id),s=val('ns');u.status=s;u.manual=1;notify(id,s==='admitted'?'Вы допущены к основному этапу! Подробности — в личном кабинете.':s==='rejected'?'Отбор завершён: вы не прошли. Спасибо за участие!':'Ваш статус изменён: «'+ST[s][0]+'».');save();modal(null);toast('Статус обновлён');render()}
function auto(id){U(id).manual=0;sync(id);save();modal(null);render()}
function mv(i,d){const a=S.tasks,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function delT(id){ask('Удалить испытание и все ответы по нему?',()=>{S.tasks=S.tasks.filter(t=>t.id!==id);S.subs=S.subs.filter(s=>s.tid!==id);syncAll();modal(null);render()})}
let Dr;const nq=()=>({type:'choice',q:'',o:['','','',''],c:0});
function editT(x){Dr=T(x)?JSON.parse(JSON.stringify(T(x))):{id:'',type:x,title:'',desc:'',instr:'',pass:60,dl:N()+7*D,qs:[nq()]};formT()}
function coll(){if(!$('tn'))return;Dr.title=val('tn');Dr.desc=val('td');Dr.dl=new Date($('tl').value).getTime();if(Dr.type==='test'){Dr.pass=+val('tp');Dr.qs.forEach((q,i)=>{q.type=val('qt'+i)||q.type||'choice';q.q=val('qq'+i);q.o=q.o.map((_,j)=>val(`qo${i}_${j}`));const r=document.querySelector(`input[name=qc${i}]:checked`);q.c=r?+r.value:0})}else Dr.instr=val('ti')}
function formT(){const t=Dr,te=t.type==='test';modal(`<h2>${t.id?'Редактирование':'Новое'}: ${te?'тест':'задание с отправкой материала'}</h2><label>Название</label><input id="tn" value="${h(t.title)}"><label>Описание</label><textarea id="td" rows="2">${h(t.desc)}</textarea><div class="g2"><div><label>Дедлайн</label><input id="tl" type="datetime-local" value="${li(t.dl)}"></div>${te?`<div><label>Проходной балл, %</label><input id="tp" type="number" min="1" max="100" value="${t.pass}"></div>`:''}</div>${te?`<h3 style="margin-top:16px">Вопросы</h3>${t.qs.map((q,i)=>`<div class="q"><div class="row j"><b>Вопрос ${i+1}</b><select id="qt${i}" style="width:auto" onchange="coll();formT()"><option value="choice" ${q.type!=='open'?'selected':''}>С вариантами ответа (автопроверка)</option><option value="open" ${q.type==='open'?'selected':''}>Открытый ответ (проверяет организатор)</option></select>${t.qs.length>1?`<button class="btn s d" onclick="coll();Dr.qs.splice(${i},1);formT()">Удалить</button>`:''}</div><input id="qq${i}" value="${h(q.q)}" placeholder="Текст вопроса">${q.type==='open'?'<p class="sm mu" style="margin:8px 0 0">Участник введёт текстовый ответ — вы оцените его вручную во вкладке «Проверка».</p>':q.o.map((o,j)=>`<div class="op"><input type="radio" name="qc${i}" value="${j}" ${q.c===j?'checked':''} title="Правильный ответ"><input id="qo${i}_${j}" value="${h(o)}" placeholder="Вариант ${j+1}"></div>`).join('')}${q.type==='open'?'':'<div class="sm mu">Отметьте кружком правильный ответ. Пустые варианты игнорируются.</div>'}</div>`).join('')}<button class="btn" onclick="coll();Dr.qs.push(nq());formT()">+ Добавить вопрос</button>`:`<label>Инструкция для участника</label><textarea id="ti" rows="4">${h(t.instr)}</textarea>`}<div class="er" id="terr"></div><div class="row" style="margin-top:16px"><button class="btn p" onclick="saveT()">Сохранить</button><button class="btn" onclick="modal(null)">Отмена</button></div>`)}
function saveT(){coll();const t=Dr,er=$('terr');if(!t.title)return er.textContent='Введите название';if(isNaN(t.dl))return er.textContent='Укажите дедлайн';
if(t.type==='test'){if(t.pass<1||t.pass>100)return er.textContent='Проходной балл — от 1 до 100';for(const [i,q] of t.qs.entries()){if(!q.q)return er.textContent=`Вопрос ${i+1}: введите текст`;if(q.type==='open')continue;if(q.o.filter(Boolean).length<2)return er.textContent=`Вопрос ${i+1}: нужно минимум 2 варианта`;if(!q.o[q.c])return er.textContent=`Вопрос ${i+1}: правильный ответ должен быть заполнен`}}
if(t.id){S.tasks[S.tasks.findIndex(x=>x.id===t.id)]=t}else{t.id='t'+N();S.tasks.push(t);parts().forEach(u=>notify(u.id,`🆕 Новое испытание: «${t.title}» — до ${fd(t.dl)}.`))}
syncAll();modal(null);toast('Испытание сохранено');render()}
function saveEv(){Object.assign(S.ev,{title:val('en'),dates:val('ed'),place:val('ep'),desc:val('ec'),next:val('ex'),seq:$('es').checked});save();toast('Мероприятие сохранено')}
async function exportCsv(){const c=v=>`"${String(v??'').replace(/"/g,'""')}"`,hd=['ФИО','Почта','Телефон','Telegram','Вуз','Направление','Курс','Статус','Рейтинг',...S.tasks.map(t=>t.title)];
const rows=parts().map(u=>[u.name,u.email,u.phone,u.tg,u.uni,u.dir,u.course,ST[u.status][0],rate(u)??'',...S.tasks.map(t=>{const b=sub(u.id,t.id);return b?(t.type==='test'&&b.pct!=null?b.pct+'% ':'')+(b.res===null?'ожидает проверки':b.res==='pass'?'пройдено':'не пройдено'):'—'})]);
const csv='\ufeff'+[hd,...rows].map(r=>r.map(c).join(';')).join('\n');
try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='hackflow_results.csv';document.body.appendChild(a);a.click();a.remove();toast('Файл с результатами выгружен');return}catch(e){}
modal(`<h2>Результаты отбора (CSV)</h2><p class="mu sm">Скопируйте и вставьте в Excel или Google Таблицы.</p><textarea rows="12" readonly onfocus="this.select()">${h(csv)}</textarea><button class="btn p" style="margin-top:12px" onclick="modal(null)">Закрыть</button>`)}
load();render();
</script></body></html>
